# Déploie le site sur GitHub Pages à chaque push sur main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Ne publier que les fichiers du site (pas doc/, ni le prompt, ni le README).
      - name: Build site folder
        run: |
          mkdir _site
          cp -r index.html css js assets .nojekyll _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
